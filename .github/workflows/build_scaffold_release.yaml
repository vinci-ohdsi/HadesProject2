name: Build project scaffold release
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Explicit main tag or commit SHA to package"
        required: true
        type: string
concurrency:
  group: project-scaffold-release
  cancel-in-progress: false
env:
  GH_HOST: va.ghe.com
  GH_TOKEN: ${{ github.token }}
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: source
        name: Resolve explicit main source
        run: |
          set -euo pipefail
          git fetch origin main --tags
          source_sha="$(git rev-parse "${{ inputs.source_ref }}^{commit}")"
          git merge-base --is-ancestor "$source_sha" origin/main
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Assemble allowlisted scaffold
        id: archive
        run: |
          set -euo pipefail
          source_sha="${{ steps.source.outputs.sha }}"
          source_worktree="$RUNNER_TEMP/scaffold-source"
          bundle_dir="$RUNNER_TEMP/project-scaffold"
          archive_name="project-scaffold-$source_sha.zip"
          archive_path="$RUNNER_TEMP/$archive_name"
          checksum_path="$RUNNER_TEMP/$archive_name.sha256"

          rm -rf "$source_worktree" "$bundle_dir"
          git worktree add --detach "$source_worktree" "$source_sha"
          cleanup() { git worktree remove --force "$source_worktree" 2>/dev/null || true; }
          trap cleanup EXIT

          test -f "$source_worktree/.Rprofile"
          test -f "$source_worktree/HadesProject.Rproj"
          test -f "$source_worktree/renv/activate.R"
          test -d "$source_worktree/extras/EunomiaDatasets-main"
          test -d "$source_worktree/extras/jdk1.8"
          test -f "$source_worktree/extras/sqljdbc42.jar"
          test -f "$source_worktree/extras/postgresql-42.3.10.jar"
          
          mkdir -p "$bundle_dir/renv" "$bundle_dir/extras"
          cp "$source_worktree/.Rprofile" "$bundle_dir/.Rprofile"
          cp "$source_worktree/HadesProject.Rproj" "$bundle_dir/HadesProject.Rproj"
          cp "$source_worktree/renv/activate.R" "$bundle_dir/renv/activate.R"
          cp -a "$source_worktree/extras/EunomiaDatasets-main" "$bundle_dir/extras/"
          cp -a "$source_worktree/extras/jdk1.8" "$bundle_dir/extras/"
          cp "$source_worktree/extras/sqljdbc42.jar" "$bundle_dir/extras/sqljdbc42.jar"
          cp "$source_worktree/extras/postgresql-42.3.10.jar" "$bundle_dir/extras/postgresql-42.3.10.jar"
          
          shopt -s nullglob
          examples=("$source_worktree"/Example*.R)
          if ((${#examples[@]})); then cp -a "${examples[@]}" "$bundle_dir/"; fi

          test ! -e "$bundle_dir/renv.lock"
          test ! -e "$bundle_dir/renv/library"
          
          cat > "$bundle_dir/manifest.txt" <<MANIFEST          
          Scaffold source commit: $source_sha
          Contents: .Rprofile, HadesProject.Rproj, renv/activate.R, Example*.R, extras/EunomiaDatasets-main/, extras/jdk1.8, extras/sqljdbc42.jar, extras/postgresql-42.3.10.jar
          MANIFEST
          
          (cd "$bundle_dir" && 7z a -tzip "$archive_path" . >/dev/null)
          (cd "$RUNNER_TEMP" && sha256sum "$archive_name" > "$archive_name.sha256")
          
          echo "tag=project-scaffold-$source_sha" >> "$GITHUB_OUTPUT"
          echo "archive=$archive_path" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum_path" >> "$GITHUB_OUTPUT"

      - name: Publish checksum-protected scaffold release
        run: |
          set -euo pipefail
          tag="${{ steps.archive.outputs.tag }}"
          if gh release view "$tag" --repo "$GH_HOST/$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.archive.outputs.archive }}" "${{ steps.archive.outputs.checksum }}" --repo "$GH_HOST/$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${{ steps.archive.outputs.archive }}" "${{ steps.archive.outputs.checksum }}" --repo "$GH_HOST/$GITHUB_REPOSITORY" --target "${{ steps.source.outputs.sha }}" --title "Project scaffold ${{ steps.source.outputs.sha }}" --notes "Allowlisted project scaffold for portable air-gapped environment bundles."
          fi
