name: Build DuckDB release asset for Windows R
permissions: {contents: write}
on:
  workflow_dispatch:
    inputs:
      r_version: {description: "Full R version to build against", required: true, default: "4.5.2", type: string}
      duckdb_version: {required: true, default: "2.0.0", type: string}
      dbi_version: {required: true, default: "1.3.0", type: string}
env:
  R_VERSION: ${{ inputs.r_version }}
  R_PLATFORM: x86_64-w64-mingw32
  GH_HOST: github.com    
  GH_TOKEN: ${{ github.token }}
  
jobs:
  build:
    runs-on: windows-latest
    defaults: {run: {shell: bash}}
    steps:
      - uses: actions/checkout@v5
      - id: r-version
        name: Derive R major.minor
        run: |
          set -euo pipefail
          R_MINOR="$(printf "%s" "$R_VERSION" | cut -d. -f1,2)"
          case "$R_MINOR" in [0-9]*.[0-9]*) ;; *) echo "Invalid R version: $R_VERSION"; exit 1 ;; esac
          echo "minor=$R_MINOR" >> "$GITHUB_OUTPUT"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: false
      - id: cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/duckdb-release-asset
          key: duckdb-r${{ steps.r-version.outputs.minor }}-${{ inputs.duckdb_version }}-dbi-${{ inputs.dbi_version }}
      - name: Build DuckDB on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          INPUT_DUCKDB_VERSION: ${{ inputs.duckdb_version }}
          INPUT_DBI_VERSION: ${{ inputs.dbi_version }}
        run: |
          set -euo pipefail
          export RENV_BOOTSTRAP_LIBRARY="$RUNNER_TEMP/renv-bootstrap" R_LIBS_USER="$RUNNER_TEMP/empty-r-library" DUCKDB_LIBRARY="$RUNNER_TEMP/duckdb-library"
          rm -rf "$RENV_BOOTSTRAP_LIBRARY" "$R_LIBS_USER" "$DUCKDB_LIBRARY" "$RUNNER_TEMP/duckdb-release-asset"
          mkdir -p "$RENV_BOOTSTRAP_LIBRARY" "$R_LIBS_USER" "$DUCKDB_LIBRARY" "$RUNNER_TEMP/duckdb-release-asset"
          Rscript --vanilla - <<'RSCRIPT'
          version <- Sys.getenv("INPUT_DUCKDB_VERSION")
          if (!grepl("^[0-9]+(\\.[0-9]+)+$", version)) {
            stop("Invalid DuckDB version: ", version)
          }

          repo <- "https://cloud.r-project.org"
          packages <- available.packages(repos = repo, type = "source", filters = character())
          current <- if ("duckdb" %in% rownames(packages)) packages["duckdb", "Version"] else NA_character_
          filename <- paste0("duckdb_", version, ".tar.gz")
          url <- if (!is.na(current) && current == version) {
            paste0(repo, "/src/contrib/", filename)
          } else {
            paste0(repo, "/src/contrib/Archive/duckdb/", filename)
          }

          source_dir <- tempfile("duckdb-source-")
          dir.create(source_dir)
          tarball <- file.path(source_dir, filename)
          download.file(url, tarball, mode = "wb", quiet = FALSE)
          if (untar(tarball, files = "duckdb/DESCRIPTION", exdir = source_dir) != 0) {
            stop("Could not extract DuckDB source metadata")
          }
          actual <- read.dcf(file.path(source_dir, "duckdb", "DESCRIPTION"))[1, "Version"]
          if (actual != version) {
            stop("DuckDB version mismatch: requested ", version, ", source contains ", actual)
          }
          message("Building DuckDB ", actual, " from ", url)

          b <- Sys.getenv("RENV_BOOTSTRAP_LIBRARY")
          l <- Sys.getenv("DUCKDB_LIBRARY")
          install.packages("renv", repos = repo, lib = b)
          library(renv, lib.loc = b)
          .libPaths(c(l, .Library))
          renv::install(paste0("DBI@", Sys.getenv("INPUT_DBI_VERSION")), library = l)
          Sys.setenv(MAKEFLAGS = "-j2")
          install.packages(tarball, repos = NULL, type = "source", lib = l)
          stopifnot(
            as.character(packageVersion("DBI", lib.loc = l)) == Sys.getenv("INPUT_DBI_VERSION"),
            as.character(packageVersion("duckdb", lib.loc = l)) == version,
            R.version$platform == Sys.getenv("R_PLATFORM")
          )
          RSCRIPT
          (cd "$DUCKDB_LIBRARY" && zip -qr "$RUNNER_TEMP/duckdb-release-asset/duckdb-windows-r${{ steps.r-version.outputs.minor }}-x86_64-w64-mingw32-${{ inputs.duckdb_version }}.zip" duckdb)
      - uses: actions/cache/save@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/duckdb-release-asset
          key: duckdb-r${{ steps.r-version.outputs.minor }}-${{ inputs.duckdb_version }}-dbi-${{ inputs.dbi_version }}
      
      - name: Verify GitHub CLI authentication
        run: |
          set -euo pipefail
          echo "Github host: $GH_HOST"
          gh auth status --hostname "$GH_HOST"
          echo "Github repository: $GITHUB_REPOSITORY"
          gh api --hostname "$GH_HOST" "repos/$GITHUB_REPOSITORY" --silent
        
      - name: Publish release asset
        env:
          TAG: duckdb-windows-r${{ steps.r-version.outputs.minor }}-duckdb-${{ inputs.duckdb_version }}
          ASSET: ${{ runner.temp }}/duckdb-release-asset/duckdb-windows-r${{ steps.r-version.outputs.minor }}-x86_64-w64-mingw32-${{ inputs.duckdb_version }}.zip
        run: |
          if gh release view "$TAG"  --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then gh release upload "$TAG" "$ASSET"  --repo "$GITHUB_REPOSITORY" --clobber; else gh release create "$TAG" "$ASSET"  --repo "$GITHUB_REPOSITORY" --title "DuckDB ${{ inputs.duckdb_version }} for Windows R ${{ steps.r-version.outputs.minor }}" --notes "Built with DBI ${{ inputs.dbi_version }}."; fi
